# Verify the browser packages in Actions without changing a public
# release. Publishing needs a separate, reviewed process with immutable assets.

name: verify browser release packages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-browser-release
  cancel-in-progress: false

jobs:
  verify:
    name: build and verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Check release input verification
        working-directory: hidra-browser
        run: |
          node test/release-base.js
          node test/release-runtime.js

      # Downloads the base packages (the ones on the release page) and checks
      # them: the pinned hashes, and that their Electron files, their Tor and
      # their engine are the ones the repository pins.
      - name: Verify the pinned base packages
        working-directory: hidra-browser
        run: node scripts/refresh-release.js --verify-inputs-only

      # The same question asked of the binary itself, so the log says plainly
      # which Electron the published packages run, even when the step above
      # has already refused them.
      - name: The published packages run the Electron package.json pins
        if: always()
        working-directory: hidra-browser
        run: node scripts/check-engine.js dist/release-in/*.zip

      # The engine is cross-compiled for Windows, and rusqlite is built from
      # source, so a C compiler for the target is needed and not just the Rust
      # target.
      - name: Install the Windows cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      - name: Add the Windows Rust target
        run: rustup target add x86_64-pc-windows-gnu

      # Nothing ships that fails the invariants. These are cheap, and the
      # whole reason for this release is that something shipped which should
      # not have.
      - name: The product is in English
        working-directory: hidra-browser
        run: node test/english-only.js

      - name: The anonymity panel's claims are backed by code
        working-directory: hidra-browser
        run: |
          node test/anonymity-claims.js
          node test/mqtt-worker-csp.js

      - name: The apps keep their storage and websites keep none
        working-directory: hidra-browser
        run: |
          node test/app-storage.js
          node test/display-url.js
          node test/vault.js

      - name: No addresses or content in the logs
        working-directory: hidra-node
        run: cargo test --test no_addresses_in_logs

      # Downloads the current packages as a build input, swaps in the current
      # sources and engine, then checks the generated packages. This and the
      # steps after it run only once the pinned base packages pass the step
      # above; the 1.0.0 ones do not. Packages built from scratch are checked
      # by update-sums.js before they reach the table, and by the job below
      # once they are published.
      - name: Build the packages
        working-directory: hidra-browser
        run: node scripts/refresh-release.js

      - name: The built packages run the Electron package.json pins
        working-directory: hidra-browser
        run: node scripts/check-engine.js dist/release-out/*.zip

      - name: Hash the review packages
        working-directory: hidra-browser/dist/release-out
        run: |
          ls -l
          sha256sum *.zip | tee SHA256SUMS.txt

      - name: Keep packages for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-release-review-${{ github.sha }}
          path: |
            hidra-browser/dist/release-out/*.zip
            hidra-browser/dist/release-out/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # What the download page offers, whatever built it: the packages
  # landing/SHA256SUMS.txt lists, fetched from the release of the version its
  # record names, must hash to the table and run the Electron package.json
  # pins on the Chromium the user agent claims. Independent of the job above,
  # so it answers even while the base packages are refused.
  published:
    name: the packages the table lists run the pinned Electron
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Download the packages the table lists
        run: |
          set -euo pipefail
          version=$(sed -n 's/^  latest-version:[[:space:]]*\([0-9][0-9.]*\)[[:space:]]*$/\1/p' landing/SHA256SUMS.txt)
          test -n "$version"
          mkdir -p published
          grep -E "^[0-9a-f]{64}  HidraNet-Browser-${version//./\\.}-[A-Za-z0-9-]+\.zip$" landing/SHA256SUMS.txt > published/SHA256SUMS.txt
          test -s published/SHA256SUMS.txt
          while read -r _ name; do
            curl -fsSL --retry 3 -o "published/$name" \
              "https://github.com/NeurexBK/HidraNet/releases/download/v$version/$name"
          done < published/SHA256SUMS.txt
          (cd published && sha256sum -c SHA256SUMS.txt)

      - name: They run the Electron package.json pins
        working-directory: hidra-browser
        run: node scripts/check-engine.js ../published/*.zip
