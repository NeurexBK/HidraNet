# The browser's tests, on every change to the browser or to what its tests
# read: the English-only sweep (which also reads hidra-node and the landing
# page), the storage and vault tests, who may call each handler, the VPN
# control-channel module against a stand-in service, the VPN page lint (which
# reads the service's ipc.rs, and seal.rs for the sealing the browser must
# match), the privacy policy lint (which reads the site's
# CSP, the review page's brokers, the node's default resolvers in
# hidravpn-node's config.rs, and what the issuer keeps and for how long, in
# hidravpn-issuer's main.rs and hidravpn-core's payment.rs), the
# release-signature verifier, and the
# Electron-only tests under Xvfb — among them the preload boundary, which
# proves a downloaded .html or a website gets no bridge to Tor, the vault or
# the VPN, and apps-e2e, which runs the chat, mail and forum between people
# through two local MQTT brokers and takes one of them down halfway, plus
# tor-route-electron, which proves no tab is ever routed anywhere but Tor
# (while Tor bootstraps, after Disconnect, after a crash), and
# dns-prefetch-electron, which proves a page's DNS hints never reach a
# resolver. The release checks run here too: what a package must run
# (release-runtime), the update notice and the signed record it reads
# (update-check and update-notice-electron), and, in a job of its own, the
# signature of landing/SHA256SUMS.txt.
name: Browser tests

on:
  push:
    paths:
      - "hidra-browser/**"
      - "hidra-node/src/**"
      - "hidra-node/assets/**"
      - "landing/**"
      - "hidravpn/crates/hidravpn-service/src/ipc.rs"
      - "hidravpn/crates/hidravpn-service/src/seal.rs"
      - "hidravpn/crates/hidravpn-node/src/config.rs"
      - "hidravpn/crates/hidravpn-issuer/src/main.rs"
      - "hidravpn/crates/hidravpn-core/src/payment.rs"
      - "hidravpn/crates/hidravpn-core/src/release.rs"
      - ".github/workflows/browser-tests.yml"
  # Every pull request: see the changes job below.
  pull_request:

jobs:
  # Which parts of the repository a pull request touches. The jobs below
  # need this one: on a pull request into main that touches none of these
  # paths they are skipped, which GitHub counts as passed, so the
  # repository's rules can require them without holding up a change
  # elsewhere. If this job fails or is cancelled they run anyway: only a
  # clear "not touched" skips them. The list is the same as the push
  # paths above; keep the two in step.
  changes:
    name: does the change touch the browser
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      touched: ${{ steps.diff.outputs.touched }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: diff
        name: the paths the change touches
        run: |
          # A push, or a pull request into a branch other than main: everything
          # runs. Only the result against main may skip a check main requires.
          if [ "$GITHUB_EVENT_NAME" != pull_request ] || [ "$GITHUB_BASE_REF" != main ]; then
            echo touched=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # HEAD is the pull request merged into its base, HEAD^1 the base.
          # git diff --quiet exits 0 when nothing listed changed, 1 when
          # something did, more when it cannot compare: then everything runs.
          if git diff --quiet HEAD^1 HEAD -- \
            ':(glob)hidra-browser/**' \
            ':(glob)hidra-node/src/**' \
            ':(glob)hidra-node/assets/**' \
            ':(glob)landing/**' \
            'hidravpn/crates/hidravpn-service/src/ipc.rs' \
            'hidravpn/crates/hidravpn-service/src/seal.rs' \
            'hidravpn/crates/hidravpn-node/src/config.rs' \
            'hidravpn/crates/hidravpn-issuer/src/main.rs' \
            'hidravpn/crates/hidravpn-core/src/payment.rs' \
            'hidravpn/crates/hidravpn-core/src/release.rs' \
            '.github/workflows/browser-tests.yml'; then
            echo touched=false >> "$GITHUB_OUTPUT"
          else
            echo touched=true >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  browser:
    name: node and Electron tests (Linux)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.touched != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: hidra-browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hidra-browser/package-lock.json
      - name: install
        run: npm ci
      - name: tests that need only node
        run: |
          set -e
          for t in anonymity-claims privacy-policy app-storage chat-crypto display-url english-only forum-crypto forum-registrar mqtt-worker-csp vault vpn-manager vpn-page vpn-installer vpn-leaktest release-verify ipc-senders tor-connect network-lock build-pins release-base release-notes release-runtime update-check; do
            echo "::group::$t"
            node "test/$t.js"
            echo "::endgroup::"
          done
      - name: what Electron needs on a bare runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libxss1 \
            || true
          sudo apt-get install -y -qq libasound2t64 || sudo apt-get install -y -qq libasound2
          sudo apt-get install -y -qq mosquitto
      - name: Allow only the temporary E2E broker files in AppArmor
        run: |
          # New runner images confine Mosquitto to its system configuration.
          # Keep confinement enabled; add only this suite's two private brokers.
          for profile in /etc/apparmor.d/mosquitto /etc/apparmor.d/usr.sbin.mosquitto; do
            if [ -f "$profile" ]; then
              rules="/etc/apparmor.d/local/$(basename "$profile")"
              printf '%s\n' \
                '/tmp/hidra-apps-e2e-*/{first,second}/mosquitto.conf r,' \
                '/tmp/hidra-apps-e2e-*/{first,second}/mosquitto.db{,.new} rwk,' \
                | sudo tee -a "$rules"
              sudo apparmor_parser -r "$profile"
            fi
          done
      - name: tests that need Electron
        run: |
          set -e
          for t in mail-crypto preload-boundary review-directory vault-electron chat-color mail-injection forum-injection search-injection review-injection landing-review-injection site-signing review-signing tab-session-electron fingerprint-electron tor-route-electron dns-prefetch-electron update-notice-electron apps-e2e; do
            echo "::group::$t"
            xvfb-run -a ./node_modules/.bin/electron --no-sandbox "test/$t.js"
            echo "::endgroup::"
          done

  # Once the maintainers have signed the checksum table, a change to it
  # without a new signature made offline with the release key is refused,
  # and so is a change that drops the signature. Before the first signature
  # there is nothing to check but the record's shape.
  release-sums:
    name: the checksum table is signed once it has been
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.touched != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: verify landing/SHA256SUMS.txt against SHA256SUMS.txt.sig
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -e
          flag=""
          # Was the table already signed before this change?
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            if git cat-file -e "$BASE:landing/SHA256SUMS.txt.sig" 2>/dev/null; then flag=--require-signature; fi
          elif git cat-file -e "HEAD~1:landing/SHA256SUMS.txt.sig" 2>/dev/null; then
            flag=--require-signature
          fi
          node hidra-browser/scripts/verify-sums.js $flag
