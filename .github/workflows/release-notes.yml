# Rewrite the description on the v1.0.0 release page.
#
# The packages are refreshed by publish-release.yml, which also rewrites the
# description when it publishes. This exists for the other case: the notes
# changed and the packages did not. Rebuilding four packages to change a
# paragraph would also re-upload a freshly compiled Windows engine and move
# its hash, so instead this downloads what is on the release page, hashes it,
# and writes the description from that — the table on the page is always the
# table of the files the page serves.

name: release notes

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/release-notes.md'

permissions:
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  notes:
    name: write the release description
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The notes are shown to users, so they are held to the same rule as the
      # product: English only.
      - name: The notes are in English
        working-directory: hidra-browser
        run: node test/english-only.js

      - name: Download the packages on the release page
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p assets
          gh release download v1.0.0 --repo "$GITHUB_REPOSITORY" --dir assets --pattern '*.zip'
          ls -l assets

      - name: Compose the description
        run: node hidra-browser/scripts/release-notes.js assets "$GITHUB_SHA" > notes.md

      - name: Show it
        run: cat notes.md

      - name: Write it to the release page
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit v1.0.0 --repo "$GITHUB_REPOSITORY" \
            --title 'HidraNet Browser 1.0.0' \
            --notes-file notes.md
