[node]
name = "hidra-mail-01"

[network]
listen_addr = "0.0.0.0"
listen_port = 9150

[logging]
level = "info"
format = "pretty"
# Real peer addresses and destination hostnames in the log. Leave this
# off on anything carrying other people's traffic: it is the record of
# who connected and where they went.
unsafe_addresses = false

[paths]
keys_dir = "keys"

[dht]
port = 7000
enabled = true
bootstrap_nodes = []

[proxy]
listen_addr = "127.0.0.1"
port = 9050

[hidden_service]
enabled = true
local_port = 8080
app = "hidramail"
# The mailbox name. The address is <mail_name>@<this service's .hidra address>;
# the host part is derived from the service key, which is how a recipient
# checks that whoever signed a message owns the address it claims to come
# from. Lower-case letters, digits, '.', '_' and '-' only.
mail_name = "alice"

[[relays]]
name = "relay-1"
addr = "127.0.0.1:7001"
noise_pubkey = ""

[[relays]]
name = "relay-2"
addr = "127.0.0.1:7002"
noise_pubkey = ""

[[relays]]
name = "relay-3"
addr = "127.0.0.1:7003"
noise_pubkey = ""
