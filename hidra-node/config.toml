[node]
name = "hidra-node-01"

[network]
listen_addr = "0.0.0.0"
listen_port = 9150
# This relay connects only to public addresses for others: never to its own
# loopback, its LAN or a cloud metadata service. Turn these on only for a
# test network whose relays share one machine or one LAN.
# allow_private_hops = false
# allow_private_targets = false

[logging]
level = "info"
format = "pretty"
# Real peer addresses and destination hostnames in the log. Leave this
# off on anything carrying other people's traffic: it is the record of
# who connected and where they went.
unsafe_addresses = false

[paths]
keys_dir = "keys"

[dht]
port = 7000
enabled = true
bootstrap_nodes = []

[proxy]
listen_addr = "127.0.0.1"
port = 9050

[hidden_service]
enabled = false
local_port = 8080
# app = "hidrachat"  # uncomment to run HidraChat on this node

[[relays]]
name = "relay-1"
addr = "127.0.0.1:7001"
noise_pubkey = ""

[[relays]]
name = "relay-2"
addr = "127.0.0.1:7002"
noise_pubkey = ""

[[relays]]
name = "relay-3"
addr = "127.0.0.1:7003"
noise_pubkey = ""
