[node]
name = "hidra-node-01"

[network]
listen_addr = "0.0.0.0"
listen_port = 9150

[logging]
level = "info"
format = "pretty"
# Real peer addresses and destination hostnames in the log. Leave this
# off on anything carrying other people's traffic: it is the record of
# who connected and where they went.
unsafe_addresses = false

[paths]
keys_dir = "keys"

[dht]
port = 7000
enabled = true
bootstrap_nodes = []

[proxy]
listen_addr = "127.0.0.1"
port = 9050

[hidden_service]
enabled = false
local_port = 8080
# app = "hidrachat"  # uncomment to run HidraChat on this node

# Optional noise_pubkey: base64-encoded 32-byte X25519 static public key.
# Nonempty keys are verified during connection setup; empty keys are unpinned.
[[relays]]
name = "relay-1"
addr = "127.0.0.1:7001"
noise_pubkey = ""

[[relays]]
name = "relay-2"
addr = "127.0.0.1:7002"
noise_pubkey = ""

[[relays]]
name = "relay-3"
addr = "127.0.0.1:7003"
noise_pubkey = ""
