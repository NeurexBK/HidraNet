[node]
name = "hidra-node-01"

[network]
listen_addr = "0.0.0.0"
listen_port = 9150

[logging]
level = "info"
format = "pretty"
# Real peer addresses and destination hostnames in the log. Leave this
# off on anything carrying other people's traffic: it is the record of
# who connected and where they went.
unsafe_addresses = false

[paths]
keys_dir = "keys"

[dht]
port = 7000
enabled = true
bootstrap_nodes = []

[proxy]
listen_addr = "127.0.0.1"
port = 9050

[hidden_service]
enabled = false
local_port = 8080
# app = "hidrachat"  # uncomment to run HidraChat on this node

# Relays this node may build circuits through, besides the ones it finds in
# the DHT with a signed descriptor. Each needs the base64 X25519 key the relay
# logs at startup ("noise_pubkey"); an entry without one is skipped, because
# a circuit could not tell that relay from anyone else answering there.
#
# [[relays]]
# name = "relay-1"
# addr = "198.51.100.1:9150"
# noise_pubkey = "<base64 key>"
