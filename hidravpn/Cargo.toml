# HidraVPN — the decentralised VPN of the HidraNet network.
#
# Its own workspace, apart from hidra-node (the relay engine) on purpose: the
# VPN must not change how anything that already ships is built or tested.
[workspace]
resolver = "2"
members = [
  "crates/hidravpn-tun",
  "crates/hidravpn-core",
  "crates/hidravpn-node",
  "crates/hidravpn",
  "crates/hidravpn-service",
  "crates/hidravpn-sign",
  "crates/hidravpn-issuer",
]

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/NeurexBK/HidraNet"
publish = false

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util", "fs", "process"] }
boringtun = { version = "0.7", default-features = false }
tun-rs = { version = "2", features = ["async_tokio"] }
wireguard-control = "2"
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio", "https-ring", "webpki-roots"] }
ed25519-dalek = "3"
sha2 = "0.10"
hkdf = "0.12"
getrandom = "0.3"
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
base64 = "0.22"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
windows = "0.58"
# RFC 9474 blind signatures for passes (phase 5). 0.18 is the release that
# sits on the constant-time RSA (rsa 0.10, crypto-bigint): the issuer signs
# messages its clients chose, which is exactly where the older rsa crate's
# timing leak (RUSTSEC-2023-0071) would be exploitable.
blind-rsa-signatures = "0.18"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"

# Prime generation for RSA keys is slow unoptimised; the tests make issuer
# keys, so the big-number crates are built optimised even in debug builds.
[profile.dev.package.crypto-bigint]
opt-level = 3
[profile.dev.package.crypto-primes]
opt-level = 3
[profile.dev.package.rsa]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
