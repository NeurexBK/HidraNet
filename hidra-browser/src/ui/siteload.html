<!DOCTYPE html>
<html lang="en">
<head>
<!--
  These pages hold the keys to the user's mail and rooms in this origin's
  storage, and they render text that arrives from strangers. Script injected
  into one of them is only worth something if it can send what it steals
  somewhere, so the policy below is built around cutting off every exit:
  connect-src names the handful of hosts each page genuinely talks to,
  img-src refuses remote URLs (an <img src> to an attacker's host is the
  simplest beacon there is), form-action and base-uri are shut, and
  frame-ancestors stops the page being framed.

  script-src still carries 'unsafe-inline', because the logic lives in inline
  script elements; moving it into separate files, and dropping that, is the
  next step. Until then the exits above are what the policy is doing.

  worker-src names blob: because the bundled MQTT client runs its keepalive
  timers in a Worker loaded from a blob URL. Without the directive the policy
  falls back to script-src, the Worker is refused, and the rejection kills the
  'connect' handler before it subscribes: the page still publishes, so sending
  looks fine, and nothing ever arrives. A blob: Worker can only be created by
  script already running in this document, which 'unsafe-inline' above already
  allows, so this opens no exit the policy was closing.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; worker-src blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' wss://broker.emqx.io:8084 wss://broker.hivemq.com:8884; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading .hidra site…</title>
<script src="vendor/mqtt.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#06070d;color:#e9ecf5;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:#0b0d16;border-bottom:1px solid #1c2133;font-size:.8em;color:#9aa3bd;flex-shrink:0}
.bar .lock{color:#00d4aa}
.bar code{color:#00d4aa;font-family:'SF Mono',monospace;font-size:.92em;word-break:break-all;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60%}
.bar .st{margin-left:auto;color:#5b6480}
#frame{flex:1;border:none;width:100%;background:#fff}
.center{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;text-align:center;padding:30px}
.spin{width:34px;height:34px;border:3px solid #1a1a2e;border-top-color:#00d4aa;border-radius:50%;animation:s .8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.center h2{color:#00d4aa;font-weight:400;font-size:1.2em}
.center.err h2{color:#ff5c6c}
.center p{color:#5b6480;font-size:.9em;max-width:380px;line-height:1.6}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="bar">
  <span class="lock">🔒</span><code id="addr">—</code>
  <span class="st" id="st">connecting…</span>
</div>
<div class="center" id="loading">
  <div class="spin"></div>
  <h2>Looking for the site on the HidraNet network</h2>
  <p>Content is encrypted — decrypting with the address…</p>
</div>
<div class="center err hidden" id="error">
  <h2>Site not found</h2>
  <p id="err-msg">This .hidra site is not online right now, or the address is wrong.</p>
</div>
<iframe id="frame" class="hidden" sandbox="allow-same-origin allow-popups allow-forms"></iframe>

<script>
'use strict';
var $=function(id){return document.getElementById(id)};
var MQTT_BROKERS=['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt'];
var enc=new TextEncoder(), dec=new TextDecoder();
var bundle=null, addr='', mqttClient=null, done=false;

function qparam(n){ var m=new RegExp('[?&]'+n+'=([^&]+)').exec(location.search); return m?decodeURIComponent(m[1]):''; }
async function deriveKey(a){var km=await crypto.subtle.importKey('raw',enc.encode(a),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:enc.encode('hidra-site-v1'),iterations:100000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
async function siteTopic(a){var b=await crypto.subtle.digest('SHA-256',enc.encode('hidra-site-topic:'+a));var u=new Uint8Array(b),h='';for(var i=0;i<16;i++)h+=u[i].toString(16).padStart(2,'0');return 'hsite/'+h;}
async function D(k,b64){var raw=atob(b64),a=new Uint8Array(raw.length);for(var i=0;i<raw.length;i++)a[i]=raw.charCodeAt(i);if(a.length<13)return null;var p=await crypto.subtle.decrypt({name:'AES-GCM',iv:a.slice(0,12)},k,a.slice(12));return dec.decode(p);}

function fail(m){ if(done)return; done=true; $('loading').classList.add('hidden'); $('error').classList.remove('hidden'); if(m)$('err-msg').textContent=m; $('st').textContent='offline'; if(mqttClient)try{mqttClient.end(true)}catch(e){} }

async function start(){
  addr=qparam('addr'); if(!addr.toLowerCase().endsWith('.hidra')) addr=addr+'.hidra';
  $('addr').textContent=addr;
  if(!addr||addr==='.hidra'){ fail('Invalid address.'); return; }
  var key,top;
  try{ key=await deriveKey(addr); top=await siteTopic(addr); }catch(e){ fail('Cryptography error.'); return; }
  $('st').textContent='connecting…';
  mqttClient=mqtt.connect(MQTT_BROKERS[0],{clientId:'hidrasee_'+Math.floor(Math.random()*1e9),clean:true,connectTimeout:9000,reconnectPeriod:0,keepalive:30});
  mqttClient.on('connect',function(){ $('st').textContent='searching…'; mqttClient.subscribe(top,{qos:0}); });
  mqttClient.on('error',function(){ fail('No connection to the network.'); });
  mqttClient.on('message',async function(t,payload){
    if(done) return;
    var plain=await D(key,payload.toString()).catch(function(){return null;});
    if(plain===null){ fail('Could not decrypt (wrong address).'); return; }
    try{ bundle=JSON.parse(plain); }catch(e){ fail('Invalid content.'); return; }
    done=true;
    render('index.html');
    $('loading').classList.add('hidden'); $('frame').classList.remove('hidden'); $('st').textContent='online';
  });
  setTimeout(function(){ fail(); }, 10000);
}

function normalize(p){ p=(p||'').split('#')[0].split('?')[0]; if(p.indexOf('/')>=0)p=p.split('/').pop(); if(!p||p==='')p='index.html'; return p; }
function render(path){
  if(!bundle) return;
  $('frame').srcdoc=bundle[path]||bundle['index.html']||'<h1>Page not found</h1>';
}
// A published site runs with no scripts at all — the frame has no
// allow-scripts, so nothing a stranger publishes can run in this page's
// origin. Links between the site's own pages used to be followed by a script
// injected into the site, which for that same reason never ran: clicking
// shop.html loaded this browser's own apps server into the frame instead. So
// they are followed from out here, where scripts do run.
$('frame').addEventListener('load',function(){
  var doc; try{ doc=$('frame').contentDocument; }catch(e){ return; }
  if(!doc) return;
  doc.addEventListener('click',function(e){
    var a=e.target&&e.target.closest?e.target.closest('a'):null; if(!a) return;
    var h=a.getAttribute('href')||'';
    if(/^(https?:|mailto:|#)/i.test(h)) return;
    e.preventDefault(); render(normalize(h));
  });
});

start();
</script>
</body>
</html>
